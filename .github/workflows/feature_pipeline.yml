name: Feature Pipeline (Hourly)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOPS_DISABLE_HOURLY_MATERIALIZATION: "true"

on:
  schedule:
    # Run every hour at minute 17 to avoid GitHub Actions congestion
    - cron: '17 * * * *'
  workflow_dispatch:  # Allow manual triggering

# ---------------------------------------------------------------------
# FIX: Prevent overlapping runs.
# If a previous hourly run is still going when the next one starts,
# the old run is cancelled automatically. This prevents two pipeline
# instances from inserting to Hopsworks at the same time, which was
# a secondary cause of "materialization already running" conflicts.
# ---------------------------------------------------------------------
concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  fetch-realtime-data:
    runs-on: ubuntu-latest
    # 30 minutes: most hourly runs finish in ~5 min (no materialization).
    # Every 6 hours, the run waits for the Spark materialization job (~15-20 min).
    # 30 min gives enough headroom for both cases without blocking the next run.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "LAT=${LAT:-33.5973}" >> .env
          echo "LON=${LON:-73.0479}" >> .env
          echo "CITY=${CITY:-Rawalpindi}" >> .env
          if [ -n "${{ secrets.HOPSWORKS_API_KEY }}" ]; then
            echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> .env
          fi
        env:
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          CITY: ${{ secrets.CITY }}

      - name: Run feature pipeline
        run: |
          python src/ingestion/fetch_realtime.py

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-pipeline-logs
          path: |
            data/raw/*.csv
          retention-days: 7
